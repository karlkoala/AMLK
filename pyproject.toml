[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mathkomp"
version = "0.1.0"
description = "MVP V1.0 - Adaptives Mathematik-Lern- und Kompetenzsystem, Sprint 1-3"
requires-python = ">=3.11"
# Keine Laufzeitabhaengigkeiten: sqlite3 und json kommen aus der Standardbibliothek.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mathkomp = "mathkomp.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mathkomp = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
